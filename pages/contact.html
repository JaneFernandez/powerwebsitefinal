<main id="contenu-principal">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card-contact p-4 p-md-5">
                <h1 class="h2 text-center text-gold fw-bold mb-4">CONTACTEZ UN COACH</h1>
                <p class="text-center mb-4">Une question sur nos <strong>programmes</strong> ? Laissez-nous un message.</p>

                <form id="formulaire-contact" novalidate>
                    <div class="mb-3">
                        <label class="form-label" for="champ-nom">Nom complet</label>
                        <input type="text" id="champ-nom" name="nom" class="form-control" data-regle="nom"
                               autocomplete="name" placeholder="Ex : Jean Dupont" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="champ-email">Adresse email</label>
                        <input type="email" id="champ-email" name="email" class="form-control" data-regle="email"
                               autocomplete="email" placeholder="nom@exemple.com" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="champ-sujet">Sujet</label>
                        <select id="champ-sujet" name="sujet" class="form-control">
                            <option value="programme">Question sur un programme</option>
                            <option value="tarif">Tarifs et abonnements</option>
                            <option value="autre">Autre demande</option>
                        </select>
                    </div>

                    <div class="mb-4">
                        <label class="form-label" for="champ-message">Message</label>
                        <textarea id="champ-message" name="message" class="form-control" data-regle="message"
                                  rows="5" placeholder="Comment pouvons-nous vous aider ?" required></textarea>
                    </div>

                    <button type="submit" class="btn btn-gold w-100 py-2" title="Envoyer le message au coach">ENVOYER LE MESSAGE</button>
                </form>
            </div>
        </div>
    </div>
</div>
